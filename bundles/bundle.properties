# ---------- HELP ----------
mod.inferno-advanced.help.title = Quick Reference

mod.inferno-advanced.help.getting-started.title = Getting started
mod.inferno-advanced.help.getting-started.desc = Start with the refractory-bronze smelter — it is the base crafting block for most advanced recipes. Celestine ore is the next gate: mine it, and use the synthesizer if a sector lacks it. Only then can you unlock strontium, barium and caesium.

mod.inferno-advanced.help.crafting.title = Production chain
mod.inferno-advanced.help.crafting.desc = Refractory bronze: copper + lead + graphite, with power. Celestine: sand + carbon dioxide. Strontium: celestine + coal + pyratite, with cryofluid. Barium-133: titanium + lead. Caesium-137: thorium + sand, with water. Barium-137m: barium-133 + caesium-137, with cryofluid. Each tier needs more power and a bigger footprint.

mod.inferno-advanced.help.items.title = Items
mod.inferno-advanced.help.items.desc = Refractory bronze is a structural alloy — build with it like titanium. Celestine is a mildly radioactive ore. Strontium, barium-133, barium-137m and caesium-137 are strong isotopes: they are RTG fuel, turret ammo, and recipe inputs for late-game blocks.

mod.inferno-advanced.help.liquids.title = Liquids
mod.inferno-advanced.help.liquids.desc = Oil waste and carbon dioxide are both produced by the sand oil rig (place it on an oil tile, feed sand + water + power). Oil waste burns in the waste burner for cheap power. Carbon dioxide is a coolant and the celestine synthesizer input.

mod.inferno-advanced.help.turrets.title = Turrets
mod.inferno-advanced.help.turrets.desc = Skyfall → Downpour → Hail form the MLRS line: range and payload grow, fire-rate drops. Sievert is a charged gamma laser — long spin-up, big single hit, radiation splash. Impulse is a short-range knockback turret with slow effect against air.

mod.inferno-advanced.help.blackhole.title = Singularity Cannon
mod.inferno-advanced.help.blackhole.desc = Launches a black hole that pulls in and damages enemies, distorts the screen around it, and applies Gravity Collapse to survivors. Needs cryofluid and a steady 45/s power feed — don't chain it off a single reactor.

mod.inferno-advanced.help.radiation.title = Radiation
mod.inferno-advanced.help.radiation.desc = Three tiers (weak → medium → strong). It drains HP, reduces max health, slows the unit and weakens its damage. Fire or blast can escalate a weak dose into a strong one. Water washes the effect off — a wet unit also downgrades strong radiation back to weak.

mod.inferno-advanced.help.mines.title = Mines
mod.inferno-advanced.help.mines.desc = Trigger mines (cluster, blast) detonate on contact with a ground unit and are destroyed in the process — they fire a burst of shrapnel or a single blast. Tripwire mines arm, wait a short fuse, then fire a cone of shrapnel — the target has a window to move.

mod.inferno-advanced.help.units.title = Aircraft (in development)
mod.inferno-advanced.help.units.desc = Swift, Hornet and Falcon exist in the mod as content, but are not yet wired into the vanilla reconstructors — you cannot build them in a normal campaign. Abilities: Barrel Roll parries enemy projectiles in a small radius; Dash is a charged high-speed ram that deals contact damage and shoves units aside. See the mod changelog for when integration lands.

mod.inferno-advanced.help.compat.title = Vanilla integration
mod.inferno-advanced.help.compat.desc = The mod hooks into the vanilla RTG generator: isotopes are registered as RTG fuel. Per unit, caesium-137 and strontium burn roughly twice as long as thorium, barium-133 about 3.8×, and barium-137m about 10×. Celestine ore is also scattered into Serpulo campaign sectors with a per-sector chance.

mod.inferno-advanced.help.tips.title = Tips
mod.inferno-advanced.help.tips.desc = Reserve a dedicated power plant for the Singularity Cannon — underfeeding it wastes the whole reload. Use a CO₂ vent to put out fires near your base. The waste burner turns otherwise useless oil waste into reliable power — a good early sink for the oil rig's output.