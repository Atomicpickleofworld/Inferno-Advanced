# ---------- HELP ----------
mod.inferno-advanced.help.title = Краткая справка

mod.inferno-advanced.help.getting-started.title = С чего начать
mod.inferno-advanced.help.getting-started.desc = Начните с плавильни тугоплавкой бронзы — это базовый крафтер для большинства продвинутых рецептов. Следующий шаг — целестиновая руда: добывайте её, а если в секторе нет — используйте синтезатор. Только после этого открываются стронций, барий и цезий.

mod.inferno-advanced.help.crafting.title = Производственная цепочка
mod.inferno-advanced.help.crafting.desc = Тугоплавкая бронза: медь + свинец + графит, с энергией. Целестин: песок + углекислый газ. Стронций: целестин + уголь + пиратит, с криожидкостью. Барий-133: титан + свинец. Цезий-137: торий + песок, с водой. Барий-137m: барий-133 + цезий-137, с криожидкостью. Каждый следующий тир требует больше энергии и места.

mod.inferno-advanced.help.items.title = Ресурсы
mod.inferno-advanced.help.items.desc = Тугоплавкая бронза — конструкционный сплав, используйте её как титан. Целестин — слаборадиоактивная руда. Стронций, барий-133, барий-137m и цезий-137 — сильные изотопы: топливо для РИТЭГ, боеприпасы и ингредиенты поздних рецептов.

mod.inferno-advanced.help.liquids.title = Жидкости
mod.inferno-advanced.help.liquids.desc = Нефтяные отходы и углекислый газ производит нефтяная вышка (ставьте на нефтяной тайл, подавайте песок + воду + энергию). Отходы сжигаются в waste burner ради дешёвой энергии. Углекислый газ — хладагент и вход синтезатора целестина.

mod.inferno-advanced.help.turrets.title = Турели
mod.inferno-advanced.help.turrets.desc = Skyfall → Downpour → Hail — линейка РСЗО: растёт дальность и мощь залпа, падает скорострельность. Sievert — заряжаемый гамма-лазер: долгая раскрутка, мощный одиночный удар, радиационный сплеш. Impulse — короткобойная турель-отталкиватель с замедлением, работает только по воздуху.

mod.inferno-advanced.help.blackhole.title = Пушка-сингулярность
mod.inferno-advanced.help.blackhole.desc = Запускает чёрную дыру, которая притягивает и повреждает врагов, искажает экран вокруг и накладывает «Гравитационный коллапс» на выживших. Нужны криожидкость и стабильные 45 энергии в секунду — не цепляйте её на один реактор.

mod.inferno-advanced.help.radiation.title = Радиация
mod.inferno-advanced.help.radiation.desc = Три тира (слабая → средняя → сильная). Отнимает HP, режет максимальный запас здоровья, замедляет юнита и ослабляет его урон. Огонь или взрыв могут перевести слабую дозу в сильную. Вода смывает эффект — намокший юнит откатывает сильную радиацию до слабой.

mod.inferno-advanced.help.mines.title = Мины
mod.inferno-advanced.help.mines.desc = Нажимные мины (cluster, blast) срабатывают от наземной цели и разрушаются сами — выстреливают или осколками, или одним мощным взрывом. Растяжечные мины (tripwire, storm) встают на изготовку, ждут короткий фитиль и бьют конусом осколков — у цели есть окно, чтобы уйти.

mod.inferno-advanced.help.units.title = Авиация (в разработке)
mod.inferno-advanced.help.units.desc = Swift, Hornet и Falcon существуют в моде как контент, но ещё не вписаны в ванильные реконструкторы — в обычной кампании их не построить. Способности: «Бочка» парирует вражеские снаряды в небольшом радиусе; «Рывок» — заряженный таран с контактным уроном и расталкиванием. Следите за чейнджлогом — интеграция появится позже.

mod.inferno-advanced.help.compat.title = Интеграция с ванилью
mod.inferno-advanced.help.compat.desc = Мод подключается к ванильному РИТЭГу: изотопы зарегистрированы как топливо. По длительности горения цезий-137 и стронций примерно в 2 раза долговечнее тория за единицу, барий-133 — в 3.8 раза, барий-137m — примерно в 10 раз. Целестиновая руда также может появляться в секторах кампании Серпуло с шансом на сектор.

mod.inferno-advanced.help.tips.title = Советы
mod.inferno-advanced.help.tips.desc = Выделите Пушке-сингулярности отдельную электростанцию — недокорм срывает весь цикл перезарядки. Ставьте CO₂-вент рядом с базой, чтобы тушить пожары. Waste burner — хороший ранний сток для нефтяной вышки.

# ========== ЖИДКОСТИ ==========
 liquid.inferno-advanced-oil-waste.name = Нефтяные отходы
liquid.inferno-advanced-oil-waste.description = Тяжёлая, вязкая, горючая жидкость. Побочный продукт синтетической нефтепереработки. Медленно горит, взрывоопасна при нагреве. Замедляет юнитов при контакте.
liquid.inferno-advanced-oil-waste.details = «Не совсем нефть, но горит почти так же хорошо.»

liquid.inferno-advanced-carbon-dioxide.name = Углекислый газ
liquid.inferno-advanced-carbon-dioxide.description = Бесцветный негорючий газ. Используется как хладагент в криогенных системах и как средство пожаротушения. Безопасен при правильном применении.
liquid.inferno-advanced-carbon-dioxide.details = «Мы выдыхаем его каждый день. Теперь он работает на нас.»

# ========== ПРЕДМЕТЫ ==========
item.inferno-advanced-refractory-bronze.name = Тугоплавкая бронза
item.inferno-advanced-refractory-bronze.description = Сплав меди, свинца и графита с повышенной термостойкостью. Используется в конструкциях, работающих при экстремальных температурах: реакторах, плавильнях и тяжёлой артиллерии.
item.inferno-advanced-refractory-bronze.details = «Там, где обычная медь плавится, бронза только начинает работать.»

item.inferno-advanced-celestine.name = Целестин
item.inferno-advanced-celestine.description = Кристаллический минерал с полупроводниковыми свойствами. Добывается титановым буром. Используется как сверхпроводник в продвинутой электронике и системах удержания плазмы, а также для получения Стронция.
item.inferno-advanced-celestine.details = «Холодный на ощупь, но проводит ток лучше любого металла.»

item.inferno-advanced-strontium.name = Стронций
item.inferno-advanced-strontium.description = Радиоактивный изотоп с высокой удельной активностью. При горении даёт интенсивное малиновое пламя. Используется в термоядерных реакторах и как компонент мощных взрывчатых смесей.
item.inferno-advanced-strontium.details = «Красивое пламя. Последнее, что увидит враг.»

item.inferno-advanced-barium-133.name = Барий-133
item.inferno-advanced-barium-133.description = Стабильный радиоактивный изотоп бария. Используется как сырьё для производства метастабильного изомера барий-137m через процесс нейтронного обогащения.
item.inferno-advanced-barium-133.details = «Сам по себе безопасен. Пока не попадёт в центрифугу.»

item.inferno-advanced-barium-137m.name = Барий-137m
item.inferno-advanced-barium-137m.description = Метастабильный ядерный изомер с экстремальной радиоактивностью. Буква "m" в названии означает metastable — возбуждённое состояние ядра. Используется в гамма-оружии направленной энергии. Не будем все усложнять реальными законами распада, ограничимся игровой условностью.
item.inferno-advanced-barium-137m.details = «Один грамм этого вещества излучает больше гамма-квантов, чем тонна урана. Хранить в свинцовом контейнере. Всегда.»

item.inferno-advanced-cesium-137.name = Цезий-137
item.inferno-advanced-cesium-137.description = Высокорадиоактивный и химически активный изотоп. При контакте с водой бурно реагирует с выделением водорода. Используется в ядерных батареях и как компонент для обогащения бария.
item.inferno-advanced-cesium-137.details = «Не ронять в воду. Не ронять вообще. Лучше даже не смотреть.»

item.inferno-advanced-cermet.name = Керамет
item.inferno-advanced-strontium-titanate.name = Титанат стронция
# ========== ЗАВОДЫ ==========
block.inferno-advanced-refractory-bronze-smelter.name = Плавильня тугоплавкой бронзы
block.inferno-advanced-refractory-bronze-smelter.description = Сплавляет медь, свинец и графит в тугоплавкую бронзу. Работает при высоких температурах, требует постоянного энергоснабжения. Первый шаг в производственной цепочке мода.
block.inferno-advanced-refractory-bronze-smelter.details = «Графит делает медь прочнее. Свинец — пластичнее. Вместе — материал, который не боится жара.»

block.inferno-advanced-celestine-synthesizer.name = Синтезатор целестина
block.inferno-advanced-celestine-synthesizer.description = Выделяет целестин из песка путём карбонизации в потоке углекислого газа. Универсальный, но медленный способ: четыре синтезатора едва покрывают одну центрифугу. Жила под бурами даёт вдвое больше.
block.inferno-advanced-celestine-synthesizer.details = «Песок, газ и терпение. Преимущественно терпение.»

block.inferno-advanced-strontium-centrifuge.name = Центрифуга стронция
block.inferno-advanced-strontium-centrifuge.description = Высокоскоростная центрифуга для выделения радиоактивного стронция из целестина. Использует пиротит и уголь как катализаторы реакции. Потребляет криогенку для охлаждения роторов.
block.inferno-advanced-strontium-centrifuge.details = «Вращение со скоростью 40 000 об/мин разделяет изотопы, которые иначе не разделить ничем.»

block.inferno-advanced-barium133-producer.name = Производитель бария-133
block.inferno-advanced-barium133-producer.description = Выделяет стабильный изотоп бария-133 из титана и свинца путём химического осаждения. Медленный, но надёжный процесс. Барий-133 используется как сырьё для дальнейшего обогащения.
block.inferno-advanced-barium133-producer.details = «Терпение — главный ингредиент ядерной физики.»

block.inferno-advanced-cesium-generator.name = Генератор цезия-137
block.inferno-advanced-cesium-generator.description = Извлекает радиоактивный цезий-137 из тория и песка с использованием воды как растворителя. Цезий химически крайне активен — требует осторожного обращения.
block.inferno-advanced-cesium-generator.details = «Один литр воды и килограмм цезия — и у вас проблемы размером с цех.»

block.inferno-advanced-barium-enricher.name = Обогатитель бария
block.inferno-advanced-barium-enricher.description = Преобразует барий-133 и цезий-137 в метастабильный изомер барий-137m через процесс нейтронного обогащения. Самый технологически сложный крафтер в цепочке. Требует криогенки и большого количества энергии.
block.inferno-advanced-barium-enricher.details = «Возбуждённое состояние ядра. Один грамм — и целая электростанция не нужна.»

# =========== ГЕНЕРАТОРЫ ЭНЕРГИИ ===========
block.inferno-advanced-strontium-generator.name = Стронциевый генератор
block.inferno-advanced-strontium-generator.description = Простой термоэлектрический генератор, использующий тепло распада стронция. Медленный, но стабильный источник энергии. Работает долго на одном стержне.
block.inferno-advanced-strontium-generator.details = «Не ядерный реактор, но и не костёр. Золотая середина.»

block.inferno-advanced-strontium-reactor.name = Стронциевый реактор
block.inferno-advanced-strontium-reactor.description = Полноценный ядерный реактор на стронции. Генерирует огромное количество энергии, но требует постоянного охлаждения криогенкой. При перегреве происходит ядерный взрыв с радиоактивным заражением местности.
block.inferno-advanced-strontium-reactor.details = «Малиновое зарево над реактором — это красиво. Пока вы не поняли, что это значит.»

block.inferno-advanced-waste-burner.name = Отходная ТЭЦ
block.inferno-advanced-waste-burner.description = Сжигает тяжёлые нефтяные отходы для генерации энергии. Мощнее угольных генераторов, но требует постоянного потока жидкости.
block.inferno-advanced-waste-burner.details = «То, что было мусором, теперь греет город.»
# =========== ДРУГОЕ ===========
block.inferno-advanced-sand-oil-rig.name = Буровая установка
block.inferno-advanced-sand-oil-rig.description = Бурит нефтеносный пласт и перерабатывает сырую нефть прямо на месте. Песок и вода расходуются на промывку и крепление скважины. На выходе — тяжёлые нефтяные отходы и попутный углекислый газ, разведённые по противоположным патрубкам: отходы с одной стороны, газ с другой. Эффективность полностью зависит от нефтеносности пола под установкой, поэтому ставится строго на месторождения. Избыток попутного газа сжигается на факеле.
block.inferno-advanced-sand-oil-rig.details = «Попутный газ мы не выбрасываем. Мы его красиво сжигаем.»

block.inferno-advanced-co2-vent.name = Углекислотная вентиляция
block.inferno-advanced-co2-vent.description = Система пожаротушения. Использует углекислый газ из труб для вытеснения кислорода в радиусе действия, мгновенно туша пожары. Требует подключения к источнику CO2.
block.inferno-advanced-co2-vent.details = «Нет кислорода — нет огня. Простая физика.»

# ========== ТУРЕЛИ ==========
block.inferno-advanced-impulse.name = Импульс
block.inferno-advanced-impulse.description = Турель волнового контроля. Испускает расширяющиеся импульсные сферы, которые отталкивают и замедляют воздушные цели. Неэффективна против наземных юнитов. Отлично работает в связке с притягивающими турелями, удерживая врагов в мёртвой зоне.
block.inferno-advanced-impulse.details = «Не убивает — но и не даёт приблизиться. Иногда этого более чем достаточно.»

block.inferno-advanced-skyfall.name = Скайфолл
block.inferno-advanced-skyfall.description = Лёгкая зенитная РСЗО раннего этапа. Залп из 6 ракет по воздушным целям. Принимает свинец и пиротит как боеприпасы. Быстро перезаряжается, но не справляется с тяжёлой авиацией в одиночку.
block.inferno-advanced-skyfall.details = «Дешёвое небо — это небо, в которое стреляют.»

block.inferno-advanced-MLRS-downpour.name = РСЗО Ливень
block.inferno-advanced-MLRS-downpour.description = Залповая РСЗО средней дальности. Выпускает рой из 12 ракет по наземным целям. Эффективна против скоплений врагов, но бесполезна против воздушных юнитов. Три типа боеприпасов позволяют адаптировать урон под ситуацию.
block.inferno-advanced-MLRS-downpour.details = «Когда одного ствола мало, а для шести — ещё рано.»

block.inferno-advanced-MLRS-hail.name = РСЗО Град
block.inferno-advanced-MLRS-hail.description = Тяжёлая осадная РСЗО дальнего радиуса действия. Выпускает залп из 42 ракет, способный накрыть целую вражескую базу. Потребляет нефть для реактивных запусков. Работает как по наземным, так и по воздушным целям.
block.inferno-advanced-MLRS-hail.details = «Звук его запуска слышен раньше, чем прилетают ракеты. Обычно этого достаточно, чтобы противник передумал наступать.»

block.inferno-advanced-sievert.name = Зиверт
block.inferno-advanced-sievert.description = Мощное гамма-оружие направленной энергии. Во время зарядки формирует воронку из шестиугольных энергетических элементов, затем испускает короткий, но разрушительный луч. Пробивает броню, накладывает эффект радиации средней тяжести на выживших. Эффективен против тяжёлых юнитов и скоплений.
block.inferno-advanced-sievert.details = «Назван в честь единицы измерения ионизирующего излучения. Враги, пережившие попадание, обычно с этим согласны.»

# ========== МИНЫ ==========
block.inferno-advanced-cluster-mine.name = Кластерная мина
block.inferno-advanced-cluster-mine.description = Контактная мина. При срабатывании выпускает 8 осколков во все стороны с небольшой площадью поражения. Осколки пробивают до двух целей насквозь. Дешёвая защита проходов от мелких наземных угроз.
block.inferno-advanced-cluster-mine.details = «Одна мина — восемь проблем.»

block.inferno-advanced-blast-mine.name = Подрывная мина
block.inferno-advanced-blast-mine.description = Контактная мина повышенной мощности. При срабатывании детонирует одним зарядом с огромной площадью поражения и высоким уроном. Одна срабатывающая копия — одна уничтоженная группа. Требует взрывчатку в производстве.
block.inferno-advanced-blast-mine.details = «Взрыв — универсальный язык.»

block.inferno-advanced-tripwire-mine.name = Натяжная мина
block.inferno-advanced-tripwire-mine.description = Мина с направленным конусом срабатывания (40°). Выпускает 7 пробивных осколков в сторону цели, когда враг пересекает линию обнаружения. Требует точной установки — не сработает на атаку с фланга.
block.inferno-advanced-tripwire-mine.details = «Невидимая линия, которую лучше не пересекать.»

block.inferno-advanced-storm-mine.name = Штормовая мина
block.inferno-advanced-storm-mine.description = Усиленная натяжная мина с широким конусом срабатывания (120°). При активации выпускает 12 разрывных снарядов с большой площадью поражения. Требует пластана и взрывчатки. Лучшая защита узких коридоров и проходов.
block.inferno-advanced-storm-mine.details = «Узкий проход больше не про вас.»

# ========== КАСТОМНЫЕ СТАТЫ (IAStats) ==========
