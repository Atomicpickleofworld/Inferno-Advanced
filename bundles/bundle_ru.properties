mod.inferno-advanced.features.title = Особенности:
mod.inferno-advanced.feature.blackhole = Механика сингулярности с искажением экрана
mod.inferno-advanced.feature.elements = Радиоактивные изотопы и тугоплавкие сплавы
mod.inferno-advanced.feature.turrets = Дальнобойные РСЗО, заряжаемый гамма-лазер, турель-отталкиватель
mod.inferno-advanced.feature.statuses = Новые эффекты: радиация, гравитационный коллапс
mod.inferno-advanced.feature.mines = Нажимные и растяжечные мины
